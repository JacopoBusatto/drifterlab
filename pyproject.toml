[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drifterlab"
version = "0.1.0"
description = "Reusable drifter ingestion and non-destructive trajectory auditing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "xarray>=2025.1",
    "zarr>=2.18,<3", "numcodecs>=0.12", "pyarrow>=14", "PyYAML>=6", "matplotlib>=3.8",
    "pyproj>=3.6",
]

[project.optional-dependencies]
test = ["pytest>=8", "cartopy>=0.22"]
diagnostics = ["matplotlib>=3.8"]
plotting = ["cartopy>=0.22"]
sst = ["h5netcdf>=1.3", "h5py>=3.10"]
manual-qc = ["PySide6>=6.8,<6.9", "pyqtgraph>=0.14,<0.15"]
gui-test = ["pytest-qt>=4.4,<5"]

[project.scripts]
drifterlab-drogue = "drifterlab.cli.drogue:main"
drifterlab-position-qc = "drifterlab.cli.position_qc:main"
drifterlab-manual-position-qc = "drifterlab.cli.manual_position_qc:main"
drifterlab-reconstruct-trajectories = "drifterlab.cli.reconstruct_trajectories:main"
drifterlab-pairs = "drifterlab.cli.pairs:main"
drifterlab-fsle = "drifterlab.cli.fsle:main"
drifterlab-postprocess = "drifterlab.cli.postprocess:main"
drifterlab-epsilon = "drifterlab.cli.epsilon:main"
drifterlab-epsilon-diagnostics = "drifterlab.cli.epsilon_diagnostics:main"
drifterlab-analyze = "drifterlab.cli.analyze:main"

drifterlab-prepare-mur-sst = "drifterlab.cli.prepare_mur_sst:main"
drifterlab-import-supplied-qc = "drifterlab.cli.import_supplied_qc:main"
drifterlab-compare-qc = "drifterlab.cli.compare_qc:main"
drifterlab-poje = "drifterlab.cli.poje:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
