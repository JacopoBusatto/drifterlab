[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drifterlab"
version = "0.1.0"
description = "Reusable drifter ingestion and non-destructive trajectory auditing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "xarray>=2025.1",
    "zarr>=2.18,<3", "numcodecs>=0.12", "pyarrow>=14", "PyYAML>=6", "matplotlib>=3.8",
    "pyproj>=3.6",
]

[project.optional-dependencies]
test = ["pytest>=8", "cartopy>=0.22"]
diagnostics = ["matplotlib>=3.8"]
plotting = ["cartopy>=0.22"]

[project.scripts]
drifterlab-drogue = "drifterlab.cli.drogue:main"
drifterlab-position-qc = "drifterlab.cli.position_qc:main"
drifterlab-reconstruct-trajectories = "drifterlab.cli.reconstruct_trajectories:main"
drifterlab-pairs = "drifterlab.cli.pairs:main"
drifterlab-postprocess = "drifterlab.cli.postprocess:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
