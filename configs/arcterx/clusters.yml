input:
  # Read-only reconstructed product. Starts are exact first retained QC fixes.
  zarr: ../../data/reconstruction/arcterx_trajectories_candidate/trajectories.zarr

cohorts:
  # Inspection proposes a new broad cohort after a larger adjacent-start gap.
  maximum_adjacent_start_gap_hours: 24
  # After inspection, point this to the reviewed cohort_review.csv.
  reviewed_assignments: null

grouping:
  # May remain null for --inspection; both are required for candidate grouping.
  maximum_cluster_diameter_m: null
  maximum_members_per_cluster: 5
  maximum_observed_start_spread_minutes: null
  # Optional per-reviewed-cohort replacements of any grouping value above.
  cohort_overrides: {}

diagnostics:
  nearest_neighbor_ranks: 5

output:
  # Contains separate inspection/ and candidate/ bundles.
  directory: ../../data/clusters/arcterx_candidate

plotting:
  enabled: true
  projection: PlateCarree
  central_longitude: 0
  extent: null
  figsize: [12, 9]
  dpi: 200
  land: true
  coastlines: true
  gridlines: true
